<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400&display=swap">
<style>
html,body{margin:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;font-family:Geist,sans-serif;color:#f2ead8;background:#170b12}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.85)}
.card{position:absolute;left:70px;top:140px;width:700px;height:440px;border-radius:36px;background:rgba(25,8,20,.62);box-shadow:inset 0 0 0 1.5px rgba(242,234,216,.12);backdrop-filter:blur(18px);padding:56px 60px;box-sizing:border-box;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:600}
.brand img{width:62px;height:62px;border-radius:14px}
h1{margin:0;font-size:104px;line-height:.98;letter-spacing:-.04em;font-weight:600}
.sub{font:400 26px "Geist Mono";color:rgba(242,234,216,.72)}
.hand{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.stick{position:absolute;width:26px;border-radius:13px;background:linear-gradient(90deg,#3a3a3e,#121214,#000);transform-origin:top center}
</style></head><body>
<img class="bg" src="../../docs/assets/art/dusk.jpg">
<div class="card">
 <div class="brand"><img src="../../docs/assets/mark-512.png">AiHand</div>
 <h1>A tiny (AI) hand<br>for your Mac</h1>
 <div class="sub">free · open source</div>
</div>
<div class="stick" style="left:1000px;top:560px;height:260px;transform:rotate(-14deg)"></div>
<img class="hand" src="../../docs/assets/hands/lavender.png" style="left:865px;top:140px;width:290px;transform:rotate(-14deg)">
</body></html>
